name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The backup job commits to main daily-ish (.github/workflows/backup.yml).
    # Nothing under backups/ reaches the bundle, so rebuilding the site for one
    # would be a deploy that changes not a pixel.
    paths-ignore: ['backups/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Set these in the repo: Settings → Secrets and variables → Actions →
      # Secrets: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.
      # The publishable key is a public client key; RLS protects the data.
      #
      # The site's own address is not here: vite.config.js reads public/CNAME,
      # the file this deploy already has to ship to keep the custom domain. It
      # was a SITE_URL variable until Phase 47 and the two could disagree in
      # silence — every page loaded and only the link preview was wrong.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Also variables, not secrets: a usage counter's script URL and site
          # key are public by construction — they ship in the bundle. Unset,
          # src/lib/analytics.js compiles to nothing.
          VITE_ANALYTICS_SRC: ${{ vars.VITE_ANALYTICS_SRC }}
          VITE_ANALYTICS_ATTR: ${{ vars.VITE_ANALYTICS_ATTR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
