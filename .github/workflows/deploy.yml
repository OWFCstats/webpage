name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The backup job commits to main daily-ish (.github/workflows/backup.yml).
    # Nothing under backups/ reaches the bundle, so rebuilding the site for one
    # would be a deploy that changes not a pixel.
    paths-ignore: ['backups/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Set these in the repo: Settings → Secrets and variables → Actions →
      # Secrets: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.
      # The publishable key is a public client key; RLS protects the data.
      # SITE_URL is a repository *variable*, not a secret — it is the public
      # address of the site, and it only exists because a link preview's
      # og:image has to be absolute. Unset, vite.config.js falls back to the
      # GitHub Pages address; set it to the custom domain the day there is one
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Also variables, not secrets: a usage counter's script URL and site
          # key are public by construction — they ship in the bundle. Unset,
          # src/lib/analytics.js compiles to nothing.
          VITE_ANALYTICS_SRC: ${{ vars.VITE_ANALYTICS_SRC }}
          VITE_ANALYTICS_ATTR: ${{ vars.VITE_ANALYTICS_ATTR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
