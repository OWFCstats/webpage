# The check that keeps the design rules honest.
#
# Before this, .github/workflows only built on push to main, so nothing ran the
# layout invariants unless a human remembered to — and three rounds of
# measurement drifted precisely because no job held them (ROADMAP → Phase 9).
#
# check:layout is GREEN on main and has been since Phase 10. Every known failure
# names the phase that owns it on scripts/expected-failures.js — down to two
# entries, both the crest bitmap, whose ink can't be read for contrast — and
# anything not on that list is a regression. A stale entry that has stopped
# failing also fails the run, so a fix can't forget to delete its own entry.
#
# Node 22, not 20: @supabase/supabase-js declares node >=22, `--test` only takes
# a glob from 22 on, and the JSON import attribute in fixtures/ wants a recent
# loader. deploy.yml still pins 20 — it only has to run `vite build`, and
# bumping it isn't this branch's business.

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The fixture is committed; this proves it still matches the import it
      # was parsed from rather than having drifted by hand.
      - run: npm run fixtures:build
      - run: git diff --exit-code fixtures/2025-26.json
      - run: npm test

  layout:
    name: layout invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:layout

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No Supabase credentials on a pull request, and none needed: the build
      # only has to compile.
      - run: npm run build
      # And the fixture stayed out of it. vite.config.js only adds the alias
      # when FIXTURE is set and nothing here sets it, but a shipped bundle
      # carrying a fake season and `supabaseConfigured = true` is bad enough to
      # be worth one grep for a club we have never played.
      - name: the fixture is not in the bundle
        run: |
          if grep -rq 'Old Amplefordians' dist; then
            echo 'fixture data found in dist/ — the resolve.alias leaked into the build'
            exit 1
          fi
      # Nor did the usage counter. src/lib/analytics.js promises to compile to
      # nothing when VITE_ANALYTICS_SRC is unset, which a pull request never
      # sets — and one `Boolean()` call quietly broke that promise for four
      # phases because nothing checked it (ROADMAP → Phase 45). It is the same
      # kind of claim as the one above and it gets the same kind of grep.
      - name: the usage counter is not in the bundle
        run: |
          if grep -rqE 'goatcounter|no_onload' dist; then
            echo 'counter strings found in dist/ — the `enabled` guard stopped folding away'
            exit 1
          fi
      # The offline shell, on the other hand, has to be there — both halves of
      # it. `sw.js` is served whole from public/ rather than built, so moving
      # it would break silently, and the registration is behind a PROD guard of
      # exactly the kind that folded the counter away above. Neither failure
      # shows up anywhere but on a phone with no signal.
      - name: the offline shell shipped
        run: |
          test -f dist/sw.js || { echo 'dist/sw.js is missing — see public/sw.js'; exit 1; }
          if ! grep -rq 'updateViaCache' dist/assets; then
            echo 'the worker is never registered — src/lib/offline.js folded away'
            exit 1
          fi
      # And the domain came out right. Both halves of this used to be checked by
      # hand and neither one fails visibly: a dist/ with no CNAME hands the
      # custom domain back to github.io on the next deploy, and an og:image on
      # the wrong origin only shows up in a pasted link's preview. vite.config.js
      # reads the domain straight out of public/CNAME, so this asserts the file
      # is shipped, is the domain the build used, and left no placeholder behind
      # (ROADMAP → Phase 47). No SITE_URL here, which is what production does.
      - name: the domain shipped, and the build used it
        run: |
          domain=$(cat public/CNAME 2>/dev/null | tr -d '[:space:]')
          shipped=$(cat dist/CNAME 2>/dev/null | tr -d '[:space:]')
          test -n "$domain" || { echo 'public/CNAME is missing or empty — see README → The domain'; exit 1; }
          # A bare hostname, or the checks below compare one typo against itself
          # and pass: a scheme or a trailing slash in there builds an og:image on
          # https://https://… and Pages rejects the domain outright.
          case "$domain" in
            *[!a-zA-Z0-9.-]* | .* | -* | *..*)
              echo "public/CNAME is '$domain', which is not a bare hostname"
              exit 1
              ;;
          esac
          if [ "$domain" != "$shipped" ]; then
            echo "dist/CNAME is '$shipped', not '$domain' — this deploy would drop the custom domain"
            exit 1
          fi
          if grep -q '%SITE_URL%' dist/index.html; then
            echo 'a %SITE_URL% placeholder survived the build — the transformIndexHtml hook did not run'
            exit 1
          fi
          if ! grep -q "content=\"https://$domain/og.png\"" dist/index.html; then
            echo "og:image is not on https://$domain — a pasted link previews from the wrong origin"
            exit 1
          fi
          if ! grep -q "href=\"https://$domain/\"" dist/index.html; then
            echo "the canonical is not https://$domain/ — search engines get sent elsewhere"
            exit 1
          fi
